services:
  app:
    build: .
    image: auditagent:latest
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  # Everything under /data: the user database (auditagent.db) and the PDFs and results of every audit.
  # It survives a restart and a rebuild.
  data: